name: Docker Build

on:
  push:
    branches: [ main, initial ]
  pull_request:
    branches: [ main, initial ]

jobs:
  docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: stvio/aws-waf-log-analyzer
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
    
    - name: Build and test Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        # Use the first tag from metadata
        IMAGE_TAG="${{ steps.meta.outputs.tags }}"
        echo "Using image tag: $IMAGE_TAG"
        docker run --rm $IMAGE_TAG analyze --version
        docker run --rm $IMAGE_TAG analyze --help
    
    - name: Test Docker functionality
      run: |
        # Create a test config
        echo 'aws:\n  region: us-east-1\nlogging:\n  level: INFO' > test-config.yaml
        
        # Use the first tag from metadata
        IMAGE_TAG="${{ steps.meta.outputs.tags }}"
        
        # Test config commands
        docker run --rm -v $(pwd)/test-config.yaml:/app/test-config.yaml $IMAGE_TAG config init --output /app/test-init-config.yaml
        docker run --rm -v $(pwd)/test-config.yaml:/app/test-config.yaml $IMAGE_TAG config validate /app/test-config.yaml
        
        # Clean up
        rm test-config.yaml
